name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate tag and architecture
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_TAG" == "v$version" ]]
          [[ "$(uname -m)" == arm64 ]]

      - name: Build, test and package
        run: bash scripts/package-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          archive="dist/Kando-Haptics-${version}-macOS-arm64.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" dist/SHA256SUMS.txt \
              --verify-tag --draft --title "Kando Haptics $RELEASE_TAG" \
              --notes-file .github/RELEASE_NOTES.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
